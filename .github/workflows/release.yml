name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag"
        required: true

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pack
        env: { PYTHONDONTWRITEBYTECODE: "1" }
        run: python -B tools/Release/PackAggregate.py
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/AutoXMYZ.zip --clobber
      - name: Summary
        run: |
          echo "### AutoXMYZ.zip" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/AutoXMYZ.zip >> "$GITHUB_STEP_SUMMARY"
          ls -l dist/AutoXMYZ.zip >> "$GITHUB_STEP_SUMMARY"
